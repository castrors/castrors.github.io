name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Dart 🎯
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies 📦
        run: dart pub get

      - name: Install Jaspr CLI 🛠️
        run: dart pub global activate jaspr_cli

      - name: Create Firebase Config File 🔑
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASECONFIG }}
        run: echo "$FIREBASE_CONFIG" > firebase_config.json

      - name: Clear build daemon locks 🧹
        run: |
          rm -rf $HOME/.dart_tool/build/daemon || true
          rm -rf .dart_tool/build || true

      - name: Build 🏗️
        run: |
          # Pre-start build daemon in the background to handle AOT compiler warm-up (>30s)
          dart run build_runner daemon --release --verbose &
          sleep 50
          # Run jaspr build which connects to the already warm running daemon instantly
          $HOME/.pub-cache/bin/jaspr build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/jaspr
          branch: gh-pages
